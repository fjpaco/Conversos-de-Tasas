name: Actualizar tasas

on:
  schedule:
    # GitHub usa hora UTC. 15:30 UTC = 9:30 en Querétaro / CDMX (UTC-6, sin horario de verano).
    # GitHub puede iniciar las tareas programadas con algunos minutos de retraso.
    - cron: "30 15 * * *"
  workflow_dispatch: {}   # Permite correrlo a mano con el botón "Run workflow"

permissions:
  contents: write

concurrency:
  group: actualizar-tasas
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Descargar tasas
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python scripts/update_rates.py

      - name: Guardar tasas.json en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasas.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Tasas $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
